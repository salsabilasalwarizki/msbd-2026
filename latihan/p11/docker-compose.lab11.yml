version: '3.8'

services:
  lab11-db:
    image: postgres:17-alpine
    container_name: lab11-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: msbd
    ports:
      - "5432:5432"
    networks:
      - labnet

networks:
  labnet:
    internal: true